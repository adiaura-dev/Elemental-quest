<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science | OmniQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #0e1222; --panel: #1a2136; --panel2: #141a2c; --line: #2e3854; --text: #e8ecf8; --muted: #8f9bbd; --amber: #ffb347; --violet: #7c5cff; --green: #3ddc97; --red: #ff5d73; --blue: #55cfff; --yellow: #ffd84d; --accent: #3ddc97; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: "Nunito", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; overflow-x: hidden; }
html.embed body { background: transparent; }
button { font-family: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: "Fredoka", "Nunito", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 8px 18px 50px; }
.screen { display: none; animation: screenIn .4s ease-out; }
.screen.active { display: block; }
@keyframes screenIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.hero { margin: 6px 0 22px; }
.eyebrow { color: var(--accent); font-weight: 900; letter-spacing: 3px; font-size: 12px; margin: 0 0 6px; }
.hero h1 { font-size: clamp(28px, 4vw, 42px); margin: 0 0 6px; }
.sub { color: var(--muted); font-size: 16px; margin: 0; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.tool { position: relative; text-align: left; background: linear-gradient(160deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 20px; padding: 20px; color: var(--text); overflow: hidden; transition: transform .25s, border-color .25s, box-shadow .25s; }
.tool::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 10%, var(--c), transparent 55%); opacity: .2; }
.tool:hover { transform: translateY(-5px); border-color: var(--c); box-shadow: 0 16px 36px #0007; }
.tool .ic { position: relative; font-size: 40px; display: inline-block; transition: transform .3s; }
.tool:hover .ic { transform: scale(1.2) rotate(-8deg); }
.tool h3 { position: relative; margin: 8px 0 6px; font-size: 21px; }
.tool p { position: relative; margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.tag { position: relative; display: inline-block; font-size: 10.5px; font-weight: 900; letter-spacing: 1px; padding: 4px 9px; border-radius: 20px; background: #2a3352; color: #c3cbe6; margin-right: 6px; }
.tag.rec { background: var(--accent); color: #062218; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.top h2 { margin: 0; font-size: 25px; flex: 1; }
.back { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 9px 14px; font-weight: 800; }
.back:hover { border-color: var(--accent); }
.seg { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 800; padding: 7px 12px; border-radius: 9px; font-size: 13px; }
.seg button.on { background: var(--accent); color: #062218; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.card { background: linear-gradient(160deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: 0 18px 44px #0005; }
.card.shake { animation: shake .45s linear; }
@keyframes shake { 15% { transform: translateX(-8px); } 30% { transform: translateX(7px); } 45% { transform: translateX(-5px); } 60% { transform: translateX(4px); } }
.label { color: var(--accent); font-weight: 900; letter-spacing: 2px; font-size: 12px; margin-bottom: 8px; }
.info h3 { margin: 4px 0 6px; font-size: 24px; }
.info p { color: #c3cbe6; line-height: 1.6; font-size: 14.5px; margin: 0 0 10px; }
.box { background: #10162a; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 14px; color: #c3cbe6; line-height: 1.55; margin-bottom: 9px; }
.box b { color: var(--amber); }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 900; font-size: 15px; color: #052016; background: linear-gradient(135deg, #5af0b0, var(--green)); box-shadow: 0 5px 0 #1d8a5c, 0 9px 18px #0006; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1d8a5c; }
.btn.ghost { background: #232c45; color: var(--text); box-shadow: 0 5px 0 #151b2e; }
.btn.alt { background: linear-gradient(135deg, var(--amber), #ff8a3d); color: #2a1600; box-shadow: 0 5px 0 #a3561a; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mission { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #1d2a4a; border: 1px dashed var(--blue); border-radius: 12px; padding: 10px 12px; font-weight: 800; margin-bottom: 12px; }
.score { color: var(--yellow); font-weight: 900; }
.hint { color: var(--muted); font-size: 13px; font-weight: 700; margin-top: 8px; text-align: center; }

/* svg diagrams */
svg.dia { width: 100%; height: auto; display: block; }
.part { cursor: pointer; transition: filter .2s, opacity .3s; }
.part:hover { filter: brightness(1.35) drop-shadow(0 0 6px #fff8); }
.part.sel { filter: brightness(1.45) drop-shadow(0 0 10px #ffd84d); }
.part.dim { opacity: .25; }
.part.good { animation: glowG .9s ease-out; }
.part.bad { animation: glowR .6s ease-out; }
@keyframes glowG { 40% { filter: brightness(1.6) drop-shadow(0 0 16px #3ddc97); } }
@keyframes glowR { 30% { filter: brightness(1.3) drop-shadow(0 0 14px #ff5d73); transform: translateX(4px); } }

/* quiz */
.q { font-size: clamp(19px, 2.4vw, 23px); font-weight: 800; line-height: 1.5; margin: 0 0 14px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { text-align: left; background: #222b44; border: 2px solid #313c5c; color: var(--text); border-radius: 14px; padding: 13px 15px; font-size: 16.5px; font-weight: 800; display: flex; gap: 11px; align-items: center; transition: transform .15s, border-color .2s; }
.opt .l { width: 27px; height: 27px; flex: none; border-radius: 8px; display: grid; place-items: center; background: #313c5c; font-size: 13px; color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.opt:disabled { cursor: default; }
.opt.right { background: #133d32; border-color: var(--green); }
.opt.right .l { background: var(--green); color: #062218; }
.opt.wrong { background: #46202a; border-color: var(--red); animation: shake .4s; }
.opt.wrong .l { background: var(--red); color: #fff; }
.opt.dim { opacity: .45; }
.fb { margin-top: 12px; border-radius: 12px; padding: 0 13px; max-height: 0; overflow: hidden; transition: all .35s; font-weight: 700; line-height: 1.5; }
.fb.show { max-height: 260px; padding: 11px 13px; }
.fb.good { background: #133d32; border: 1px solid var(--green); color: #b8f5dc; }
.fb.bad { background: #3d1c25; border: 1px solid var(--red); color: #ffc7cf; }
.fb.info { background: #1d2a4a; border: 1px solid var(--blue); color: #c7ecff; }
.progress { display: flex; gap: 5px; margin-bottom: 14px; }
.progress i { flex: 1; height: 7px; border-radius: 8px; background: #252e47; }
.progress i.now { background: var(--blue); }
.progress i.good { background: var(--green); }
.progress i.bad { background: var(--red); }
.results { text-align: center; padding: 16px 0; }
.stars { font-size: 58px; letter-spacing: 8px; }
.stars span { display: inline-block; color: #3a4466; opacity: 0; animation: starIn .5s cubic-bezier(.2,1.6,.4,1) forwards; }
.stars span.on { color: var(--yellow); text-shadow: 0 0 20px #ffd84d; }
@keyframes starIn { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: none; } }

/* physics */
input[type=range] { width: 100%; accent-color: var(--amber); }
.slider { margin-bottom: 12px; }
.slider .row { justify-content: space-between; font-weight: 800; font-size: 14px; margin-bottom: 4px; }
.slider b { color: var(--yellow); font-family: "Fredoka", sans-serif; font-size: 18px; }
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.meter { background: #0f1426; border: 1px solid var(--line); border-radius: 12px; padding: 9px; text-align: center; }
.meter span { display: block; font-size: 10.5px; color: var(--muted); font-weight: 900; letter-spacing: 1px; }
.meter b { font: 700 22px "Fredoka", sans-serif; color: #fff; }
.mats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mat { background: #222b44; border: 2px solid #313c5c; color: var(--text); border-radius: 12px; padding: 9px 6px; font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.mat span { font-size: 24px; }
.mat:hover { border-color: var(--amber); }
.mat.done-y { border-color: var(--green); }
.mat.done-n { border-color: var(--red); }
canvas.road, canvas.graph { width: 100%; display: block; background: #0f1426; border: 1px solid var(--line); border-radius: 14px; }
.ans { width: 110px; font: 800 22px "Fredoka", sans-serif; text-align: center; background: #0f1426; color: #fff; border: 2px solid #34406a; border-radius: 12px; padding: 7px; outline: none; }
.ans:focus { border-color: var(--amber); }

.pop { position: fixed; z-index: 60; transform: translate(-50%, -50%); font: 700 23px "Fredoka", sans-serif; text-shadow: 3px 3px 0 #0b0f1c; pointer-events: none; white-space: nowrap; animation: fly 1.2s ease-out forwards; }
@keyframes fly { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); } 35% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -200%); } }
.toast { position: fixed; left: 50%; top: 16px; z-index: 70; opacity: 0; transform: translate(-50%, -120px); background: var(--panel); border: 1px solid var(--accent); color: #fff; font-weight: 900; padding: 11px 18px; border-radius: 14px; transition: transform .4s cubic-bezier(.2,1.4,.4,1), opacity .3s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 65; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 560px) { main { padding: 6px 10px 40px; } .opts { grid-template-columns: 1fr; } .card { padding: 15px; } .mats { grid-template-columns: repeat(2, 1fr); } .meters { grid-template-columns: repeat(3, 1fr); } .meter b { font-size: 17px; } }
</style>
</head>
<body>
<main>
  <section class="screen active" id="home">
    <div class="hero"><p class="eyebrow" id="h-eyebrow"></p><h1 id="h-title"></h1><p class="sub" id="h-sub"></p></div>
    <div class="tools" id="tools"></div>
  </section>
  <section class="screen" id="tool">
    <div class="top"><button class="back" id="back">← All</button><h2 id="t-title"></h2><div id="t-extra"></div></div>
    <div id="t-body"></div>
  </section>
</main>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================
   OMNIQUEST SCIENCE: Biology + Physics
   science.html?subject=biology  or  ?subject=physics
   ===================================================== */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const params = new URLSearchParams(location.search);
const SUBJECT = params.get("subject") === "physics" ? "physics" : "biology";
const EMBED = params.get("embed") === "1";
if (EMBED) document.documentElement.classList.add("embed");
if (SUBJECT === "physics") document.documentElement.style.setProperty("--accent", "#ffb347");

/* ---------- shared progress (same storage as the whole site) ---------- */
const KEY = "omniQuest";
const shared = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (_) { return {}; } };
const GRADE = () => Number(shared().grade) || 7;
function patch(fn) {
  try { const d = shared(); fn(d); localStorage.setItem(KEY, JSON.stringify(d)); } catch (_) { /* ignore */ }
  if (EMBED && parent !== window) parent.postMessage({ oq: "xp" }, "*");
}
let streak = 0;
function addXP(n, el) {
  patch(d => { d.xp = (d.xp || 0) + n; d.solved = (d.solved || 0) + 1; });
  pop(`+${n} XP`, "#ffd84d", el);
}
function right(el, base = 10) {
  streak++;
  patch(d => { d.bestStreak = Math.max(d.bestStreak || 0, streak); });
  sfx.good();
  addXP(base + Math.min(10, (streak - 1) * 2), el);
  if ([3, 5, 10].includes(streak)) setTimeout(() => pop(`🔥 ${streak} IN A ROW!`, "#ff9f43", null, true), 250);
}
function wrong(card) { streak = 0; sfx.bad(); if (card) { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); } }

/* ---------- sound + effects ---------- */
let ac = null;
function tone(f, d, type = "sine", v = .07, w = 0) {
  if (shared().sound === false) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime + w, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02); } catch (_) { /* no sound */ }
}
const sfx = { good() { tone(660, .12, "triangle"); tone(990, .18, "triangle", .07, .1); }, bad() { tone(200, .18, "sawtooth", .04); tone(140, .3, "sawtooth", .04, .12); }, click() { tone(520, .05, "sine", .03); }, win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, "triangle", .07, i * .11)); } };
function pop(text, color, el, big) {
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 3, width: 0, height: 0 };
  const p = document.createElement("div"); p.className = "pop"; p.textContent = text; p.style.color = color;
  if (big) p.style.fontSize = "36px";
  p.style.left = `${r.left + r.width / 2}px`; p.style.top = `${r.top + r.height / 2}px`;
  document.body.appendChild(p); setTimeout(() => p.remove(), 1250);
}
let tt; function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("show"), 2300); }
const cv = $("#confetti"), cx = cv.getContext("2d"); let conf = [];
function burst(n = 90) {
  const cols = ["#ffb347", "#7c5cff", "#3ddc97", "#ff5d73", "#55cfff", "#ffd84d"];
  const start = !conf.length;
  for (let i = 0; i < n; i++) conf.push({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, c: cols[i % 6], r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 1 });
  if (start) requestAnimationFrame(drawConf);
}
function drawConf() {
  cv.width = innerWidth; cv.height = innerHeight; cx.clearRect(0, 0, innerWidth, innerHeight);
  conf = conf.filter(c => (c.life -= .008) > 0 && c.y < innerHeight + 30);
  conf.forEach(c => { c.vy += .3; c.x += c.vx; c.y += c.vy; c.r += c.vr; cx.save(); cx.translate(c.x, c.y); cx.rotate(c.r); cx.globalAlpha = Math.min(1, c.life * 2); cx.fillStyle = c.c; cx.fillRect(-c.s / 2, -c.s / 2, c.s, c.s * .6); cx.restore(); });
  if (conf.length) requestAnimationFrame(drawConf); else cx.clearRect(0, 0, innerWidth, innerHeight);
}

/* =====================================================
   QUESTION BANKS  (g = the class it fits from)
   ===================================================== */
const BANK = {
  biology: [
    { g: 6, q: "What is the basic unit of life?", a: "Cell", o: ["Tissue", "Organ", "Atom"], e: "Every living thing is made of one or more cells." },
    { g: 6, q: "Which part controls all the activities of a cell?", a: "Nucleus", o: ["Cell membrane", "Cytoplasm", "Vacuole"], e: "The nucleus is the control centre. It holds the cell's DNA." },
    { g: 6, q: "Which part is found in plant cells but NOT in animal cells?", a: "Cell wall", o: ["Cell membrane", "Nucleus", "Cytoplasm"], e: "Plant cells have a stiff cell wall (and chloroplasts). Animal cells don't." },
    { g: 6, q: "What is the green pigment in leaves called?", a: "Chlorophyll", o: ["Haemoglobin", "Melanin", "Carotene"], e: "Chlorophyll traps sunlight for photosynthesis." },
    { g: 6, q: "Which gas do plants take in to make food?", a: "Carbon dioxide", o: ["Oxygen", "Nitrogen", "Hydrogen"], e: "Plants use carbon dioxide, water and sunlight to make glucose." },
    { g: 6, q: "Which organ pumps blood around the body?", a: "Heart", o: ["Lungs", "Liver", "Kidney"], e: "The heart is a muscular pump that beats all your life." },
    { g: 6, q: "A lack of vitamin C causes which disease?", a: "Scurvy", o: ["Rickets", "Night blindness", "Beriberi"], e: "Scurvy causes bleeding gums. Citrus fruits are rich in vitamin C." },
    { g: 6, q: "Animals that eat only plants are called…", a: "Herbivores", o: ["Carnivores", "Omnivores", "Decomposers"], e: "Cows, deer and rabbits are herbivores." },
    { g: 6, q: "Which part of a plant absorbs water from the soil?", a: "Roots", o: ["Leaves", "Flowers", "Stem"], e: "Root hairs soak up water and minerals." },
    { g: 7, q: "Organisms that make their own food have which type of nutrition?", a: "Autotrophic", o: ["Heterotrophic", "Parasitic", "Saprotrophic"], e: "'Auto' means self. Green plants are autotrophs." },
    { g: 7, q: "Where is the digestion of food completed?", a: "Small intestine", o: ["Stomach", "Mouth", "Large intestine"], e: "The small intestine finishes digestion and absorbs the nutrients." },
    { g: 7, q: "What are the tiny pores on leaves called?", a: "Stomata", o: ["Villi", "Alveoli", "Xylem"], e: "Stomata let gases in and out and let water vapour escape." },
    { g: 7, q: "Which tissue carries water and minerals up a plant?", a: "Xylem", o: ["Phloem", "Stomata", "Cambium"], e: "Xylem moves water up. Phloem moves food around." },
    { g: 7, q: "Blood vessels that carry blood AWAY from the heart are…", a: "Arteries", o: ["Veins", "Capillaries", "Nerves"], e: "Arteries carry blood away from the heart. Veins bring it back." },
    { g: 7, q: "What is the main job of the kidneys?", a: "Filter waste from the blood", o: ["Pump blood", "Digest food", "Make oxygen"], e: "The kidneys filter blood and make urine." },
    { g: 7, q: "Mushrooms get food from dead and decaying matter. This is…", a: "Saprotrophic nutrition", o: ["Autotrophic nutrition", "Parasitic nutrition", "Photosynthesis"], e: "Saprotrophs break down dead matter to get food." },
    { g: 7, q: "Potatoes can grow new plants from their 'eyes'. This is called…", a: "Vegetative propagation", o: ["Pollination", "Fertilisation", "Germination from seeds"], e: "New plants grow from parts like stems, roots or leaves." },
    { g: 8, q: "Which disease is caused by a VIRUS?", a: "Common cold", o: ["Cholera", "Malaria", "Typhoid"], e: "Colds are viral. Cholera and typhoid are bacterial. Malaria is caused by a protozoan." },
    { g: 8, q: "Malaria is spread by the female of which mosquito?", a: "Anopheles", o: ["Aedes", "Culex", "Housefly"], e: "The female Anopheles mosquito carries the malaria parasite." },
    { g: 8, q: "Who discovered penicillin, the first antibiotic?", a: "Alexander Fleming", o: ["Louis Pasteur", "Robert Hooke", "Edward Jenner"], e: "Fleming discovered penicillin in 1928, from a mould." },
    { g: 8, q: "Which organelle is called the 'powerhouse of the cell'?", a: "Mitochondria", o: ["Nucleus", "Ribosome", "Vacuole"], e: "Mitochondria release energy from food during respiration." },
    { g: 8, q: "Rhizobium bacteria in the roots of pea plants fix which gas?", a: "Nitrogen", o: ["Oxygen", "Carbon dioxide", "Hydrogen"], e: "They turn nitrogen from the air into compounds the plant can use." },
    { g: 8, q: "Which hormone controls the level of sugar in the blood?", a: "Insulin", o: ["Adrenaline", "Thyroxine", "Growth hormone"], e: "Insulin, made by the pancreas, lowers blood sugar." },
    { g: 8, q: "In humans, fertilisation usually takes place in the…", a: "Fallopian tube (oviduct)", o: ["Uterus", "Ovary", "Vagina"], e: "The egg and sperm usually meet in the oviduct." },
    { g: 9, q: "Who first observed and named 'cells' in a piece of cork?", a: "Robert Hooke", o: ["Anton van Leeuwenhoek", "Charles Darwin", "Gregor Mendel"], e: "Robert Hooke saw tiny box-like cells in cork in 1665." },
    { g: 9, q: "Which cell organelle makes proteins?", a: "Ribosome", o: ["Lysosome", "Golgi apparatus", "Vacuole"], e: "Ribosomes join amino acids to build proteins." },
    { g: 9, q: "Which organelles are called the 'suicide bags' of the cell?", a: "Lysosomes", o: ["Mitochondria", "Ribosomes", "Plastids"], e: "Lysosomes contain enzymes that can digest worn-out parts of the cell." },
    { g: 9, q: "A tendon connects…", a: "Muscle to bone", o: ["Bone to bone", "Muscle to muscle", "Nerve to muscle"], e: "Tendons join muscle to bone. Ligaments join bone to bone." },
    { g: 9, q: "Meristematic (growing) tissue is mainly found at the…", a: "Tips of roots and shoots", o: ["Middle of leaves", "Inside fruits", "Bark only"], e: "Meristems divide quickly, so plants grow at their tips." },
    { g: 9, q: "Antibiotics do NOT work against…", a: "Viruses", o: ["Bacteria", "Most bacterial infections", "Germs that cause typhoid"], e: "Antibiotics attack bacteria, not viruses." },

    ${P("er", `<path d="M300 130 q30 10 20 35 q-10 25 20 35 q30 10 15 35 M285 230 q20 15 45 5 q25 -10 40 10" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>`)}

    ${P("mito", mito(400, 115, 20) + mito(135, 255, -25))}
    ${P("golgi", `<g fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"><path d="M385 240 q30 -18 60 0"/><path d="M380 258 q35 -18 70 0"/><path d="M385 276 q30 -18 60 0"/></g>`)}

function cellTool() {
  let kind = "animal", mode = "explore", sel = null, ch = null;
  $("#t-extra").innerHTML = `<div class="seg"><button data-k="animal" class="on">🐾 Animal cell</button><button data-k="plant">🌿 Plant cell</button></div>`;
  $("#t-body").innerHTML = `<div class="grid2"><div class="card" id="cell-card"><div class="mission" id="cell-mission" hidden></div><div id="cell-svg"></div><div class="hint" id="cell-hint">👆 Tap any part of the cell</div></div>
    <div class="card info" id="cell-info"></div></div>`;
  const parts = () => [...$("#cell-svg").querySelectorAll(".part")].map(p => p.dataset.part.replace("chloro", "chloroplast")).filter((v, i, a) => a.indexOf(v) === i);
  const infoDefault = () => {
    $("#cell-info").innerHTML = `<div class="label">${kind === "animal" ? "ANIMAL CELL" : "PLANT CELL"}</div><h3>Tap a part!</h3><p>Cells are the building blocks of every living thing. Tap any coloured part to find out what it does.</p>
      <div class="box"><b>Plant vs animal:</b> only plant cells have a <b>cell wall</b>, <b>chloroplasts</b> and one <b>big vacuole</b>.</div>
      <button class="btn alt" id="cell-start">🎯 Start labelling challenge</button>`;
    $("#cell-start").addEventListener("click", startChallenge);
  };
  const draw = () => {
    $("#cell-svg").innerHTML = cellSVG(kind);
    $("#cell-svg").querySelectorAll(".part").forEach(p => p.addEventListener("click", () => clickPart(p.dataset.part === "chloro" ? "chloroplast" : p.dataset.part, p)));
  };
  const showInfo = id => {
    const d = CELL_PARTS[id], g = GRADE();
    $("#cell-info").innerHTML = `<div class="label">${kind === "animal" ? "ANIMAL" : "PLANT"} CELL PART ${d.g > g ? `<span class="tag">CLASS ${d.g}+</span>` : ""}</div><h3>${d.name}</h3><p>${d.job}</p><div class="box">${d.like}</div>
      <button class="btn alt" id="cell-start">🎯 Start labelling challenge</button>`;
    $("#cell-start").addEventListener("click", startChallenge);
  };
  const highlight = id => $("#cell-svg").querySelectorAll(".part").forEach(p => p.classList.toggle("sel", (p.dataset.part === "chloro" ? "chloroplast" : p.dataset.part) === id));
  function clickPart(id, el) {
    sfx.click();
    if (mode === "explore") { sel = id; highlight(id); showInfo(id); return; }
    if (ch.done) return;
    if (id === ch.target) {
      el.classList.add("good"); setTimeout(() => el.classList.remove("good"), 900);
      ch.score++; right(el, 8); ch.next();
    } else {
      el.classList.add("bad"); setTimeout(() => el.classList.remove("bad"), 600);
      wrong($("#cell-card")); toast(`That's the ${CELL_PARTS[id].name}!`);
      const t = [...$("#cell-svg").querySelectorAll(".part")].find(p => (p.dataset.part === "chloro" ? "chloroplast" : p.dataset.part) === ch.target);
      if (t) { t.classList.add("sel"); setTimeout(() => t.classList.remove("sel"), 1200); }
      setTimeout(() => ch.next(), 1300);
    }
  }
  function startChallenge() {
    mode = "challenge"; highlight(null);
    const pool = parts().filter(id => CELL_PARTS[id].g <= Math.max(GRADE(), 6));
    const list = shuffle(pool).concat(shuffle(pool)).slice(0, 8);
    let i = -1;
    ch = { score: 0, done: false, target: null, next() {
      if (!$("#cell-mission")) return;
      i++;
      if (i >= list.length) {
        ch.done = true; mode = "explore";
        $("#cell-mission").innerHTML = `<span>🏁 Challenge done: <span class="score">${ch.score} / ${list.length}</span></span><button class="btn ghost" id="cell-again">Again</button>`;
        $("#cell-again").addEventListener("click", startChallenge);
        if (ch.score >= 6) { sfx.win(); burst(120); }
        return;
      }
      ch.target = list[i];
      $("#cell-mission").hidden = false;
      $("#cell-mission").innerHTML = `<span>🎯 Tap the <b style="color:var(--yellow)">${CELL_PARTS[ch.target].name}</b></span><span class="score">${i + 1} / ${list.length}</span>`;
    } };
    $("#cell-hint").textContent = "Find the part named above!";
    ch.next();
  }
  document.querySelectorAll("#t-extra [data-k]").forEach(b => b.addEventListener("click", () => {
    kind = b.dataset.k; mode = "explore";
    document.querySelectorAll("#t-extra [data-k]").forEach(x => x.classList.toggle("on", x === b));
    $("#cell-mission").hidden = true; $("#cell-hint").textContent = "👆 Tap any part of the cell";
    draw(); infoDefault();
  }));
  draw(); infoDefault();
}

function quizTool() {
  const g = GRADE();
  const near = shuffle(BANK[SUBJECT].filter(q => q.g <= g && q.g >= g - 1));
  const below = shuffle(BANK[SUBJECT].filter(q => q.g < g - 1));
  const above = shuffle(BANK[SUBJECT].filter(q => q.g > g)).sort((x, y) => x.g - y.g);
  const list = shuffle(near.concat(below).concat(above).slice(0, 10));
  const res = []; let i = 0, xp = 0;
  $("#t-extra").innerHTML = `<span class="tag rec">CLASS ${g}</span>`;
  $("#t-body").innerHTML = `<div class="progress" id="qp"></div><div class="card" id="qcard"></div>`;
  const prog = () => $("#qp").innerHTML = list.map((_, k) => `<i class="${res[k] || (k === i ? "now" : "")}"></i>`).join("");
  function show() {
    if (i >= list.length) return finish();
    prog();
    const q = list[i], opts = shuffle([q.a, ...q.o]);
    $("#qcard").innerHTML = `<div class="label">QUESTION ${i + 1} / ${list.length} ${q.g > g ? `<span class="tag">CHALLENGE · CLASS ${q.g}</span>` : q.g < g - 1 ? `<span class="tag">REVISION · CLASS ${q.g}</span>` : ""}</div><p class="q">${q.q}</p>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="l">${"ABCD"[k]}</span>${o}</button>`).join("")}</div><div class="fb" id="fb"></div><div class="row" style="justify-content:flex-end;margin-top:14px" id="nx"></div>`;
    document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const ok = opts[b.dataset.k] === q.a;
      document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (opts[x.dataset.k] === q.a) x.classList.add("right"); else if (x !== b) x.classList.add("dim"); });
      const fb = $("#fb");
      if (ok) { b.classList.add("right"); right(b); xp += 10; fb.className = "fb show good"; fb.innerHTML = `✓ Correct! ${q.e}`; res[i] = "good"; }
      else { b.classList.add("wrong"); wrong($("#qcard")); fb.className = "fb show bad"; fb.innerHTML = `✗ The answer is <b>${q.a}</b>. ${q.e}`; res[i] = "bad"; }
      i++; prog();
      $("#nx").innerHTML = `<button class="btn" id="next">${i >= list.length ? "See results 🏁" : "Next →"}</button>`;
      $("#next").addEventListener("click", () => { sfx.click(); show(); });
      $("#next").focus();
    }));
  }

    const score = res.filter(r => r === "good").length, pct = score / list.length;

    if (stars >= 2) { sfx.win(); burst(150); }
    patch(d => { d.sciStars = d.sciStars || {}; d.sciStars[SUBJECT] = Math.max(d.sciStars[SUBJECT] || 0, stars); });
    $("#qcard").innerHTML = `<div class="results"><div class="label">QUIZ COMPLETE</div><div class="stars">${[1, 2, 3].map(k => `<span class="${k <= stars ? "on" : ""}" style="animation-delay:${k * .25}s">★</span>`).join("")}</div><h2>${["💪 Keep practising!", "👍 Good effort!", "🎉 Great job!", "🌟 Amazing!"][stars]}</h2><p class="sub">You got ${score} out of ${list.length}.</p>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" id="q-home">← All</button><button class="btn" id="q-again">🔁 New quiz</button></div></div>`;

  }
  show();
}

      <div class="row"><button class="btn" id="go">▶ Drive 10 s</button><button class="btn ghost" id="reset">↺ Reset</button></div>
      <div class="box" style="margin-top:12px" id="formula"></div></div></div>`;
  const road = $("#road"), rc = road.getContext("2d"), gr = $("#gr"), gc = gr.getContext("2d");
  let u = 10, a = 0, t = 0, running = false, raf = null, last = 0, pts = [], challenge = null, solved = 0;
  const T = 10, dist = tt => u * tt + .5 * a * tt * tt, maxD = () => Math.max(50, dist(T));
  function formula() { $("#formula").innerHTML = a === 0 ? `<b>Constant speed:</b> distance = speed × time<br>= ${u} × t` : `<b>Speeding up:</b> s = ut + ½at²<br>= ${u}t + ½ × ${a} × t²`; }
  function drawRoad() {
    const W = road.width, H = road.height, d = dist(t), md = maxD();
    rc.clearRect(0, 0, W, H);
    rc.fillStyle = "#1b2238"; rc.fillRect(0, 70, W, 70);
    rc.strokeStyle = "#ffd84d"; rc.setLineDash([22, 18]); rc.lineWidth = 3; rc.beginPath(); rc.moveTo(0, 105); rc.lineTo(W, 105); rc.stroke(); rc.setLineDash([]);
    rc.fillStyle = "#8f9bbd"; rc.font = "700 13px Nunito"; rc.textAlign = "center";
    const step = md > 400 ? 100 : md > 150 ? 50 : 10;
    for (let m = 0; m <= md; m += step) { const x = 30 + m / md * (W - 80); rc.fillRect(x - 1, 140, 2, 10); rc.fillText(`${m} m`, x, 166); }
    if (challenge) { const x = 30 + challenge.answer / md * (W - 80); rc.fillStyle = "#3ddc97"; if (challenge.show) { rc.fillRect(x - 2, 58, 4, 86); rc.fillText("🏁", x, 52); } }
    const x = 30 + d / md * (W - 80);
    rc.font = "44px serif"; rc.save(); rc.translate(x, 106); rc.scale(-1, 1); rc.fillText("🚗", 0, 14); rc.restore();
  }
  function drawGraph() {
    const W = gr.width, H = gr.height, p = 44, md = maxD();
    gc.clearRect(0, 0, W, H);
    gc.strokeStyle = "#2e3854"; gc.lineWidth = 1; gc.fillStyle = "#8f9bbd"; gc.font = "700 12px Nunito"; gc.textAlign = "center";
    for (let s = 0; s <= T; s += 2) { const x = p + s / T * (W - 2 * p); gc.beginPath(); gc.moveTo(x, 12); gc.lineTo(x, H - p); gc.stroke(); gc.fillText(`${s} s`, x, H - p + 18); }
    gc.textAlign = "right";
    for (let k = 0; k <= 4; k++) { const y = H - p - k / 4 * (H - p - 12); gc.beginPath(); gc.moveTo(p, y); gc.lineTo(W - p, y); gc.stroke(); gc.fillText(`${Math.round(md * k / 4)}`, p - 6, y + 4); }
    gc.save(); gc.translate(14, H / 2); gc.rotate(-Math.PI / 2); gc.textAlign = "center"; gc.fillText("distance (m)", 0, 0); gc.restore();
    gc.strokeStyle = "#55cfff"; gc.lineWidth = 3.5; gc.shadowColor = "#55cfff"; gc.shadowBlur = 8; gc.beginPath();
    pts.forEach(([tt, dd], k) => { const x = p + tt / T * (W - 2 * p), y = H - p - dd / md * (H - p - 12); k ? gc.lineTo(x, y) : gc.moveTo(x, y); });
    gc.stroke(); gc.shadowBlur = 0;
    $("#graph-note").textContent = a === 0 ? "straight line = constant speed" : "curve gets steeper = speeding up";
  }
  function meters() { $("#mt").textContent = `${t.toFixed(1)} s`; $("#md").textContent = `${Math.round(dist(t))} m`; $("#mv").textContent = `${Math.round(u + a * t)} m/s`; }
  function frame(now) {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    t = Math.min(T, t + dt * (challenge && challenge.fast ? 2 : 1)); pts.push([t, dist(t)]);
    drawRoad(); drawGraph(); meters();
    if (t >= T || (challenge && challenge.run && t >= challenge.t)) { running = false; $("#go").disabled = false; if (challenge && challenge.run) finishChallenge(); return; }
    raf = requestAnimationFrame(frame);
  }
  function reset() { cancelAnimationFrame(raf); running = false; t = 0; pts = [[0, 0]]; $("#go").disabled = false; drawRoad(); drawGraph(); meters(); formula(); }
  function go() { if (running) return; if (t >= T) reset(); running = true; $("#go").disabled = true; last = performance.now(); raf = requestAnimationFrame(frame); sfx.click(); }
  function newChallenge() {
    if (!$("#mm")) return;
    const accel = g >= 9 && Math.random() < .4;
    const cu = accel ? 0 : rnd(2, 12) * (Math.random() < .5 ? 1 : 2), ca = accel ? pick([2, 4]) : 0, ct = accel ? pick([2, 4, 6]) : rnd(3, 9);
    challenge = { u: cu, a: ca, t: ct, answer: cu * ct + .5 * ca * ct * ct, run: false, show: false };
    $("#mm").innerHTML = `<div style="flex:1">🎯 <b>Predict:</b> ${ca ? `starting from rest with a = ${ca} m/s²` : `at ${cu} m/s`}, how far in <b>${ct} s</b>?<div class="row" style="margin-top:8px"><input class="ans" id="pa" inputmode="numeric" placeholder="? m"><button class="btn alt" id="pgo">Check 🏁</button></div></div><span class="score">✓ ${solved}</span>`;
    $("#pgo").addEventListener("click", runChallenge);
    $("#pa").addEventListener("keydown", ev => { if (ev.key === "Enter") runChallenge(); });
  }
  function runChallenge() {
    const v = Number(String($("#pa").value).trim());
    if (!$("#pa").value.trim() || Number.isNaN(v)) { toast("Type a distance first! 🙂"); return; }
    challenge.guess = v; challenge.run = true; challenge.show = true;
    u = challenge.u; a = challenge.a; $("#u-in").value = u; $("#a-in").value = a; $("#u-out").textContent = `${u} m/s`; $("#a-out").textContent = `${a} m/s²`;
    $("#pgo").disabled = true; reset(); go();
  }
  function finishChallenge() {
    const c = challenge, ok = Math.abs(c.guess - c.answer) < .01;
    if (ok) { solved++; right($("#md"), 12); burst(90); toast(`🏁 Spot on! ${c.answer} m`); }
    else { wrong(); toast(`The car went ${c.answer} m, not ${c.guess} m`); }
    $("#formula").innerHTML = c.a ? `s = ½at² = ½ × ${c.a} × ${c.t}² = <b>${c.answer} m</b>` : `distance = speed × time = ${c.u} × ${c.t} = <b>${c.answer} m</b>`;
    setTimeout(() => { if (!$("#mm")) return; challenge.run = false; newChallenge(); drawRoad(); }, 2200);
  }
  $("#u-in").addEventListener("input", ev => { u = Number(ev.target.value); $("#u-out").textContent = `${u} m/s`; reset(); });
  $("#a-in").addEventListener("input", ev => { a = Number(ev.target.value); $("#a-out").textContent = `${a} m/s²`; reset(); });
  $("#go").addEventListener("click", go); $("#reset").addEventListener("click", reset);
  newChallenge(); reset();
  cleanup = () => { cancelAnimationFrame(raf); running = false; };
}

/* ---------- start ---------- */
renderHome();
openTool(location.hash.slice(1));
</script>
